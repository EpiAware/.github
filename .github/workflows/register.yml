# Triggers Julia General Registry registration by posting the
# `@JuliaRegistrator register` comment on main's HEAD — the same comment a
# maintainer would post by hand, so nothing beyond GITHUB_TOKEN is needed.
# JuliaRegistrator (the org-installed app) opens the registry PR from there,
# and TagBot cuts the release once it merges.

name: Register

on:
  workflow_call:

jobs:
  register:
    # The caller fires on `/register` comments and workflow_dispatch; gate on
    # the command here so a caller need only forward the triggers.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/register')
    runs-on: ubuntu-latest
    # contents: write posts the commit comment. issues: write posts the
    # permission-denied reaction — a PR conversation comment is an issue
    # comment for that endpoint. The collaborator check needs no extra scope.
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check permissions
        id: check-permissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTOR="${{ github.actor }}"
          else
            ACTOR="${{ github.event.comment.user.login }}"
          fi
          PERMISSION=$(gh api \
            "repos/${{ github.repository }}/collaborators/$ACTOR/permission" \
            --jq '.permission')
          echo "$ACTOR has permission: $PERMISSION"
          if [[ "$PERMISSION" == "admin" || "$PERMISSION" == "write" || \
                "$PERMISSION" == "maintain" ]]; then
            echo "has_permission=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_permission=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger JuliaRegistrator
        if: steps.check-permissions.outputs.has_permission == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/commits/main/comments" \
            --method POST --field body='@JuliaRegistrator register'

      - name: React with permission denied
        if: >-
          github.event_name == 'issue_comment' &&
          steps.check-permissions.outputs.has_permission == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            --method POST --field content='-1'
