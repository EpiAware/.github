name: Downgrade

on:
  workflow_call:
    inputs:
      julia_version:
        description: 'Julia version to run the downgrade suite on'
        required: false
        type: string
        default: '1.10'
      mode:
        description: 'julia-downgrade-compat mode (deps, alldeps, ...)'
        required: false
        type: string
        default: 'deps'
      org:
        description: 'Org hosting EpiAwarePackageTools.jl'
        required: false
        type: string
        default: EpiAware
      test_args:
        description: 'Extra args passed to julia-runtest test_args'
        required: false
        type: string
        default: 'skip_quality'

jobs:
  downgrade-compat:
    name: Downgrade Compat
    runs-on: ubuntu-latest
    # Single suite against oldest deps; cap to free a hung runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia_version }}
      # Ahead of the downgrade step, unlike the action's own example: the
      # bootstrap below writes into the depot, and a restore landing after it
      # would overwrite that with whatever the cache holds.
      - uses: julia-actions/cache@v3
      # Pkg honours `[sources]` only in the *active* project, so a step that
      # collects dependencies without resolving the pins cannot see a
      # dependency pinned by git url/rev and absent from General. A registry
      # is depot-level, so registering the pins makes them resolve by name in
      # every environment on this runner. No-op without a `[sources]` table.
      #
      # The scratch registry is rebuilt every run: a restored one is stale by
      # construction, since an unregistered pin's version never bumps when
      # its revision moves. It is dropped before the guard as well, so a
      # caller that has since dropped its pin is not left with a registry
      # still carrying the name, which fails the depot with a hash mismatch.
      - name: Bootstrap registry for unregistered [sources] deps
        run: |
          rm -rf "${JULIA_DEPOT_PATH:-$HOME/.julia}/registries/EpiAwareScratch"
          if ! grep -qE '^\[sources(\.|\])' Project.toml; then
            echo "no [sources] section: nothing to register"
            exit 0
          fi
          julia -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add([
                Pkg.PackageSpec(name = "LocalRegistry"),
                Pkg.PackageSpec(
                    url = "https://github.com/${{ inputs.org }}" *
                          "/EpiAwarePackageTools.jl",
                    rev = "main")])
            using EpiAwarePackageTools.Benchmarks: bootstrap_sources_registry
            done = bootstrap_sources_registry(pwd())
            println(isempty(done) ? "no unregistered [sources] deps" :
                    "registered: " * join(done, ", "))'
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          mode: ${{ inputs.mode }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: ${{ inputs.test_args }}
          # This job's whole point is to pin deps at their lower bound.
          # julia-runtest's default `force_latest_compatible_version:
          # 'auto'` detects a Dependabot/CompatHelper actor and flips this
          # to true, which forces the opposite of a downgrade. Pin it to
          # false so the actor-detection heuristic can never override a
          # deliberately-downgraded environment, regardless of who opened
          # the PR.
          force_latest_compatible_version: false
