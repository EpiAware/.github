# Automated Claude review on pull requests from the configured reviewer.

name: Claude Code Review

on:
  workflow_call:
    inputs:
      reviewer:
        description: >-
          Only review PRs opened by this handle. Reviews are billed against
          the org's Claude subscription, so this is deliberately not open to
          arbitrary contributors.
        required: true
        type: string
      direct_prompt:
        description: 'Review prompt; override to focus a repo review'
        required: false
        type: string
        default: |
          Please review this pull request and provide feedback on:
          - Code quality and best practices
          - Potential bugs or issues
          - Performance considerations
          - Security concerns
          - Test coverage

          Be constructive and helpful in your feedback.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    if: github.event.pull_request.user.login == inputs.reviewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: ${{ inputs.direct_prompt }}
          # Reuse one comment rather than stacking a new one per push.
          use_sticky_comment: true
