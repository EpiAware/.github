# On-demand Claude, triggered by an @claude mention from the configured
# reviewer on an issue, PR comment, or review.

name: Claude Code

on:
  workflow_call:
    inputs:
      reviewer:
        description: >-
          Only respond to this handle. Runs are billed against the org's
          Claude subscription, so mentions from anyone else are ignored.
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    if: |
      github.actor == inputs.reviewer && (
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
         (contains(github.event.issue.body, '@claude') ||
          contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      # Lets Claude read CI results on a PR.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
